name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux file helpers
        run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find
        if: runner.os == 'Linux'
      - name: Install macOS file helpers
        run: brew install ripgrep fd
        if: runner.os == 'macOS'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm run check:boundary
      - run: npm run check:docs
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:alpha
      - name: Record alpha checksums
        working-directory: .artifacts/public-packages
        run: shasum -a 256 *.tgz > SHA256SUMS
      - name: Save tested alpha downloads
        uses: actions/upload-artifact@v7
        with:
          name: alpha-${{ matrix.os }}-${{ github.sha }}
          path: .artifacts/public-packages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
